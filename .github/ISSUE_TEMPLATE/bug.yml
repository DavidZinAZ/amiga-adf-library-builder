name: Bug report
description: Report something that is broken or incorrect
title: "[BUG] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Application version
      description: Copy the version from Help → About, and include Windows version or source Python version.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: How are you running the app?
      options:
        - Portable Windows ZIP
        - Standalone Windows EXE
        - GUI from source
        - CLI from source
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the screen/action, affected release, and observed result. For CLI use, include the command and output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run...
        2. Open...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or screenshots
      description: Attach the relevant run log and screenshots if available. Remove credentials and private information; do not upload original disk collections or copyrighted media.
    validations:
      required: false
