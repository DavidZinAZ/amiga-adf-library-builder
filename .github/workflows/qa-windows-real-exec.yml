name: QA Windows real execution (Issue #15)

# Independent QA real-Windows qualification.
#
# Two modes (select via workflow_dispatch input `qual_mode`):
#   - "issue15" (default): Issue #15 GUI qualification — launch + GUI code
#     exercise + Preview/Curation + LaunchBox mappings.
#   - "gh173-rtfm": GH-173 RTFM/manual qualification — local manual
#     end-to-end + online RetroKit + restart persistence + known titles +
#     diagnostics + automated regressions.
#
# Triggered manually via workflow_dispatch, and automatically on pushes to
# feat/issue15-windows-gui / feat/issue17-folder-persistence / PRs to main
# (Issue #15 mode only).

on:
  workflow_dispatch:
    inputs:
      qual_mode:
        description: "Qualification mode"
        required: true
        default: "issue15"
        type: choice
        options:
          - issue15
          - gh173-rtfm
  push:
    branches:
      - feat/issue15-windows-gui
      - feat/issue17-folder-persistence
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  qa-windows-real:
    name: Real Windows QA (${{ github.event.inputs.qual_mode || 'issue15' }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller pillow pytest

      - name: Build onedir portable app (real artifact)
        run: python tools/build_windows.py --target onedir --clean

      - name: Run Issue #15 GUI qualification
        if: ${{ github.event.inputs.qual_mode == 'issue15' || !github.event.inputs.qual_mode }}
        env:
          QT_QPA_PLATFORM: offscreen
          QA_GUI_BASE: "C:\\Users\\runneradmin\\Test Dir With Spaces\\lib"
          QA_EXE: "dist/AmigaADFLibraryBuilder/AmigaADFLibraryBuilder.exe"
          QA_REPORT_DIR: "qa-windows-artifacts"
        run: python tools/qa_windows_real_exec.py

      - name: Run GH-173 RTFM qualification
        if: ${{ github.event.inputs.qual_mode == 'gh173-rtfm' }}
        env:
          QT_QPA_PLATFORM: offscreen
          QA_GUI_BASE: "C:\\Users\\runneradmin\\Test Dir With Spaces\\lib"
          QA_EXE: "dist/AmigaADFLibraryBuilder/AmigaADFLibraryBuilder.exe"
          QA_REPORT_DIR: "qa-rtfm-windows-artifacts"
        run: python tools/qa_rtfm_windows.py

      - name: Upload QA artifacts (report + screenshots + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-${{ github.event.inputs.qual_mode || 'issue15' }}
          path: |
            qa-windows-artifacts/
            qa-rtfm-windows-artifacts/
            C:\Users\runneradmin\Test Dir With Spaces\lib\logs\
          if-no-files-found: warn
