name: Build Windows GUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - feat/issue15-windows-gui
      - feat/issue17-folder-persistence

jobs:
  build-windows:
    name: Build Windows standalone (PyInstaller)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
          python -m pip install pyinstaller

      - name: Verify entry point imports
        # Cheap Linux/Windows-portable sanity gate: the PyInstaller hook
        # target must import cleanly.
        run: |
          python -c "import amiga_adf_library_builder.gui.app as a; assert callable(a.run)"

      - name: Verify canonical version source and drift gate
        # GH-119: all version sources must derive from pyproject.toml.
        # This gate fails if any module carries a hardcoded version
        # that diverges from pyproject.toml [project].version.
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          repo = Path.cwd()
          pyproject = (repo / "pyproject.toml").read_text()
          canonical = re.search(r'^version\s*=\s*"(.*?)"', pyproject, re.MULTILINE).group(1)

          # Check __init__.py
          init_text = (repo / "src/amiga_adf_library_builder/__init__.py").read_text()
          assert '__version__' in init_text, "__init__.py must reference __version__"

          # Check gui/__init__.py derives from canonical
          gui_init = (repo / "src/amiga_adf_library_builder/gui/__init__.py").read_text()
          assert '_version' in gui_init or '__version__' in gui_init, "gui/__init__.py must derive version from _version"

          # Check no stale hardcoded versions remain in source files
          stale_patterns = [
              r'AmigaADFLibraryBuilder/0\.2\.1\b',
              r'AmigaADFLibraryBuilder/1\.0\b',
              r'__version__\s*=\s*"0\.2\.10',
          ]
          for pattern in stale_patterns:
              for f in (repo / "src").rglob("*.py"):
                  text = f.read_text()
                  if re.search(pattern, text):
                      raise AssertionError(f"Stale version pattern {pattern!r} found in {f}")

          print(f"Version drift gate passed: canonical={canonical}")
          PY

      - name: Verify artwork runtime dependency (GH-65)
        # GH-65: the packaged app must be able to import Pillow at runtime.
        # The `gui` extra (installed above) declares pillow; this gate fails
        # the build BEFORE packaging if the build environment cannot import
        # PIL, so a regression is caught here instead of in the shipped app.
        run: |
          python - <<'PY'
          import PIL
          from PIL import Image
          print("Pillow import OK:", PIL.__version__)
          PY

      - name: Build onedir portable app
        run: |
          python tools/build_windows.py --target onedir --clean

      - name: Build onefile portable exe
        run: |
          python tools/build_windows.py --target onefile

      - name: GUI smoke test (offscreen)
        # Build-time sanity gate: the GUI module must import and construct
        # under a headless Qt platform. This does NOT launch the full windowed
        # app on Windows runners; that real-execution step lives in the QA
        # qualification workflow. Here we only prove the frozen tree imports.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import sys
          from amiga_adf_library_builder.gui.app import GuiApp
          # Construct without showing; verifies QApplication + portable paths
          # resolve headless. No runtime secrets are created.
          app = GuiApp()
          print("GuiApp constructed OK; window:", type(app.window()).__name__)
          sys.exit(0)
          PY

      - name: Package onedir artifact
        run: |
          cd dist
          7z a -r ../amiga-adf-gui-portable.zip AmigaADFLibraryBuilder

      - name: Upload onedir portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-adf-gui-portable
          path: amiga-adf-gui-portable.zip
          if-no-files-found: error

      - name: Upload onefile artifact
        uses: actions/upload-artifact@v4
        with:
          name: amiga-adf-gui-onefile
          path: dist/amiga-adf-gui.exe
          if-no-files-found: error

  release-windows:
    name: Create Windows Release Assets
    runs-on: ubuntu-latest
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download onedir artifact
        uses: actions/download-artifact@v4
        with:
          name: amiga-adf-gui-portable
          path: dist/

      - name: Download onefile artifact
        uses: actions/download-artifact@v4
        with:
          name: amiga-adf-gui-onefile
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Amiga ADF Library Builder ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/amiga-adf-gui-portable.zip
            dist/amiga-adf-gui.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
