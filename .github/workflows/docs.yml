name: Documentation links

on:
  push:
    branches: [main]
    paths: ["**/*.md", "tools/check_docs.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "tools/check_docs.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py
