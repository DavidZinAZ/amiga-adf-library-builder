# Example portable configuration (portable path configuration).
#
# Only `library_root` is required. Every other role is derived beneath it unless
# overridden here. `cache_dir` defaults to the XDG cache
# (~/.cache/amiga-adf-library-builder) when omitted.
#
# Replace the paths below with locations you choose; no host-specific value is
# required or assumed by the application.

library_root = "/path/to/my-amiga-library"

# Optional explicit role overrides (omit to use derived defaults):
# original_dir   = "/path/to/my-amiga-library/original"
# staging_dir    = "/path/to/my-amiga-library/work/staging"
# output_dir     = "/path/to/my-amiga-library/output"
# quarantine_dir = "/path/to/my-amiga-library/unknown"
# approvals_dir  = "/path/to/my-amiga-library/config/manual-approvals"
# reports_dir    = "/path/to/my-amiga-library/reports"
# logs_dir       = "/path/to/my-amiga-library/logs"
# cache_dir      = "/path/to/cache/amiga-adf-library-builder"

# --- local-media provider local-media artwork provider (base app) ------------------------
# Offline, read-only, no signup/key/network. Point at one or more LaunchBox
# (or LaunchBox-compatible) image libraries. The builder searches the configured
# platform folders, copies the chosen source into its OWN artwork cache, and
# records provenance. It NEVER modifies anything under the source roots.
#
# Platform mapping: platform_names maps to the LaunchBox Images/<Platform>
# folders. preferred_image_types sets the exact priority order searched
# (higher-priority confident matches win): Screenshot - Game Title, then
# Box - Front, then Screenshot - Gameplay.
[local_media]
enabled = false
roots = ["/path/to/LaunchBox"]
platform_names = ["Commodore Amiga", "Amiga"]
preferred_image_types = ["Screenshot - Game Title", "Box - Front", "Screenshot - Gameplay"]
recursive = true
# confidence_threshold = 0.95

# --- RTFM v2 manual sidecar (deterministic, local-only, NO-AI) ----------------
# Offline, read-only, no signup/key/network. Point at one or more local manual
# libraries (Manuals, Instructions, Cheats). The builder discovers plain-text
# sources, composes them into a GTi-compatible .rtfm, and writes a provenance
# sidecar. It NEVER modifies anything under the source roots.
#
# Online providers (PDF/HTML extraction, AI summarization) are DEFERRED; the
# [rtfm.online] table is parsed but ignored (online_enabled is never acted on).
[rtfm]
enabled = false
# Built-in templates: controls-first (default), quick-start, adventure-rpg,
# arcade-action, full-reference. Empty sections are omitted from output.
template = "controls-first"
# Conservative review-on-overflow target in bytes; must be <= 16000 (the GTi
# hard limit). Content that would exceed this is routed for review (never
# silently truncated).
max_bytes = 15360
recursive = true

[rtfm.local]
# One or more read-only roots per category. Placeholder /path/to/... values only
# (no real host paths). Each root may use any layout; discovery is recursive.
manuals = ["/path/to/manuals"]
instructions = ["/path/to/instructions"]
cheats = ["/path/to/cheats"]

[rtfm.online]
# DEFERRED in M1. Parsed and ignored. Online must stay disabled.
enabled = false

# --- Playmatch ROM-hash identity resolver (OPTIONAL, DISABLED by default) -----
# Opt-in correlation to a Playmatch ROM-hash service. Hash-first: a precomputed
# public SHA-256 (already computed by the intake scanner) is the PRIMARY lookup
# signal; an exact-hash match OUTRANKS any title fallback. A returned provider
# correlation id is captured for downstream providers. The service receives ONLY
# the public SHA-256 and the canonical title -- never private ROM filenames,
# local paths, or collection details. Disabled unless enabled = true. Self-host
# by pointing base_url at your own instance.
[playmatch]
enabled = false
# base_url = "https://api.playmatch.example/v1"
# timeout_seconds = 10.0
# max_response_bytes = 1000000
# max_concurrency = 1
# confidence_threshold = 0.9
# cache_ttl = 0  # seconds; <= 0 disables canonical-reuse cache

# --- Hasheous ROM-hash identity resolver (OPTIONAL, DISABLED by default) -----
# Opt-in correlation to a Hasheous ROM-hash service. Hash-first: a precomputed
# public SHA-256 (already computed by the intake scanner) is the PRIMARY lookup
# signal; an exact-hash match OUTRANKS any title fallback. A returned provider
# correlation id AND normalized external correlations (e.g. igdb_id) are
# captured for downstream providers. The service receives ONLY the public
# SHA-256 and the canonical title -- never private ROM filenames, local paths,
# or collection details. Disabled unless enabled = true. Self-host by pointing
# base_url at your own Hasheous-compatible instance.
#
# ACCESS LIMITATION (per issue #12 governance):
#   (1) the live Hasheous lookup is platform-scoped and requires a self-hosted /
#       Hasheous-compatible endpoint. This bundled provider is CONFIG-DRIVEN
#       and DISABLED by DEFAULT; the default base_url is a placeholder example
#       host, NOT a live endpoint.
#   (2) NO live API key is required for the supported subset (hash + title
#       lookup). If a future operation needs a credential, that is a separate
#       operator gate.
#   (3) the public repo's tests are SYNTHETIC / MOCK ONLY -- no live network.
[hasheous]
enabled = false
# base_url = "https://api.hasheous.example/v1"
# timeout_seconds = 10.0
# max_response_bytes = 1000000
# max_concurrency = 1
# confidence_threshold = 0.9
# cache_ttl = 0  # seconds; <= 0 disables canonical-reuse cache


