# --- Optional MobyGames online metadata/artwork provider (Issue #1) ------------
# DISABLED BY DEFAULT. Enable by setting enabled = true and providing an API key
# via the MOBYGAMES_API_KEY environment variable (or configure api_key_env).
# The provider searches MobyGames for the title, filters to Amiga platform
# releases, and returns metadata + cover/screenshot artwork. It reuses the
# shared cache/provenance/security architecture (no new HTTP libs, SSRF guards,
# allowlisted hosts only). See docs/mobygames-provider.md for setup and precedence.
[mobygames]
enabled = false
# api_key_env = "MOBYGAMES_API_KEY"
# preferred_image_types = ["cover", "screenshot", "box"]
# timeout = 20.0

# --- Wikipedia metadata/artwork provider (PRIMARY, enabled by default) -------
# Wikipedia is the main online source for release metadata and artwork. It needs
# no account, key or signup. Requests are PACED so the site is not overloaded:
# the settings below are applied to the shared request gate that every
# Wikipedia request in a run goes through.
#
# These values are the effective runtime policy, not decoration. They can also
# be edited in the GUI Providers section, which writes the same table.
[wikipedia]
enabled = true
# Minimum wall-clock seconds between two outbound requests. Raising this
# reduces HTTP 429 rate limiting. Allowed range 0.5 - 10.0.
min_interval_seconds = 1.0
# When Wikipedia asks us to slow down (HTTP 429), wait and retry instead of
# dropping the release.
retries_enabled = true
# How many times to retry a rate-limited request (after the first attempt).
max_retries = 2
# Obey a server-supplied "wait this many seconds" instruction...
respect_retry_after = true
# ...but never wait longer than this, even if the server asks for hours.
retry_after_cap_seconds = 60
# Reuse lookups already downloaded instead of re-requesting them.
use_cache = true

# --- ScreenScraper metadata/artwork/manual provider (OPTIONAL, DISABLED by default) --
# Opt-in metadata, artwork, and manual lookup via ScreenScraper WebAPI.
# Requires developer credentials (devid, devpassword, softname) from ScreenScraper.
# Member credentials (ssid, sspassword) are optional for higher limits.
# Credentials are NEVER stored in config files; they come from the SecretStore
# / environment variables (SCREENSCRAPER_DEV_ID, SCREENSCRAPER_DEV_PASSWORD,
# SCREENSCRAPER_SOFTNAME, SCREENSCRAPER_SSID, SCREENSCRAPER_SSPASSWORD) only.
#
# The provider supports three lookup methods in precedence order:
# 1. Hash-first: ROM hash lookup using CRC/MD5/SHA1 (exact match, highest confidence)
# 2. Provider ID reuse: cached ScreenScraper game ID from prior successful match
# 3. Title + system search: validated title + Amiga system search (relevance-gated)
#
# Artwork selection respects configured region preference. PDF manuals are retrieved
# via the mediaManuelJeu.php endpoint and fed into the existing RTFM pipeline.
#
# The provider is OFFLINE at import time. No network calls occur until a real
# fetch with --online. Tests inject fake openers; no live network in test suite.
# All outbound requests are guarded by the existing SSRF guard (metadata.guard_url).
# Rate limits and quotas are respected with a single bounded retry.
[screenscraper]
enabled = false
# base_url = "https://www.screenscraper.fr/api2/"
# timeout_seconds = 15.0
# max_response_bytes = 2000000
# max_concurrency = 1
# confidence_threshold = 0.85
# preferred_regions = ["us", "eu", "wor"]
# download_metadata = true
# download_artwork = true
# download_manuals = true
# cache_ttl = 86400  # seconds; <= 0 disables reuse
# respect_rate_limit = true
# rate_limit_backoff_seconds = 5.0

# ---------------------------------------------------------------------------
# Optional RetroKit / Archive.org MANUAL provider (GH-10). MANUALS ONLY --
# this is NOT a metadata or artwork provider. Disabled by default; the base
# application is fully functional with no Archive.org availability and no
# network. No credentials are required (Archive.org is public).
#
# The provider resolves each release group's manual against the RetroKit
# per-system TSV index (retrokit-manuals/<system>/<system>-sources.tsv),
# downloads the single selected artifact (never the multi-GB bundle), caches
# it UNMUTATED under the managed cache dir, and feeds it into the existing
# RTFM (Issue #5) PDF extraction path. Deterministic, conservative matching:
# exact/canonical identity auto-accepts; ambiguous or low-confidence matches
# are routed for review. A miss, outage, rate-limit, or corrupt artifact is
# NON-FATAL and degrades to the offline RTFM build.
#
# Tests inject fake openers; no live network in the test suite.
[retrokit_manuals]
enabled = false
# item_id = "retrokit-manuals"
# system = "amiga"
# preferred_languages = ["en"]
# prefer_original = true
# max_manual_bytes = 8388608
# index_ttl_seconds = 604800
# negative_ttl_seconds = 86400
# timeout_seconds = 30.0
# respect_rate_limit = true
# rate_limit_backoff_seconds = 5.0