[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amiga-adf-library-builder"
version = "0.2.3"
description = "Preservation-first Amiga ADF catalogue and Gotek SD-card builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]
# Optional runtime extras. The core library degrades gracefully when Pillow is
# absent (artwork/enrich raise a clear "Pillow unavailable" error instead of
# faking output). Declare it so qualification and artwork users can install it.
artwork = ["pillow>=10"]
# Issue #5: optional OFFLINE PDF / scanned-image RTFM extraction. The core
# library stays dependency-free; these are only needed to extract text from
# PDF/image manuals. Behavior degrades gracefully (clear "unavailable", no
# fabricated output) when any of these are missing or Tesseract is absent.
rtfm-docs = ["pypdf>=4", "pymupdf>=1.23", "pillow>=10", "pytesseract>=0.3"]

# Issue #15: optional PySide6 GUI (Windows presentation layer over the shared
# core). Core deps stay empty; the GUI is an additive optional extra so the
# MIT-licensed CLI/core remain dependency-free. PySide6 is LGPL (license-
# compatible); PyQt6 is deliberately avoided (GPLv3 would force GPL on an MIT
# project).
gui = ["PySide6>=6.7", "cryptography>=42.0", "tomli-w>=1.0"]

[project.scripts]
amiga-adf-library-builder = "amiga_adf_library_builder.cli:main"
# Dev/debug launcher for the PySide6 GUI (Issue #15). Exposed by `pip install .[gui]`.
# The frozen Windows artifact uses the PyInstaller hook target
# `amiga_adf_library_builder.gui.app:run`, not this console script.
amiga-adf-gui = "amiga_adf_library_builder.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

